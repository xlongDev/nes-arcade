<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NES Arcade">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#28e0d4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- glass tile -->
  <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#tile)"/>
  <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#sheen)"/>
  <rect x="57" y="57" width="398" height="398" rx="99" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- controller body: centered around (256,256) -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <rect x="116" y="196" width="280" height="120" rx="60"/>
  </g>

  <!-- d-pad -->
  <g fill="#ffffff">
    <rect x="172" y="248" width="48" height="16" rx="8"/>
    <rect x="188" y="232" width="16" height="48" rx="8"/>
  </g>

  <!-- action buttons -->
  <circle cx="320" cy="256" r="16" fill="#ffffff" opacity="0.95"/>
  <circle cx="360" cy="256" r="16" fill="#ffffff" opacity="0.95"/>

  <!-- select / start -->
  <rect x="228" y="292" width="28" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
  <rect x="268" y="292" width="28" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
</svg>
