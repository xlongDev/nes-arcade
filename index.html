<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2ff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="液态玻璃质感的 FC 红白机游戏在线合集，浏览器打开即玩，支持存档、手柄与本地 ROM 上传。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>NES Arcade · 红白机游戏厅</title>

    <script>
      // 主题预设：在首帧绘制前落定 data-theme，杜绝浅色/深色闪烁（FOUC）
      ;(() => {
        try {
          const stored = JSON.parse(localStorage.getItem('nes-arcade:prefs') || 'null')
          const mode = stored?.state?.themeMode ?? 'system'
          const dark =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : mode === 'dark'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>

    <style>
      /* 首屏骨架：JS 就位前先给一块有质感的底，避免白屏跳变 */
      html[data-theme='dark'] { background: #0b0f1a; }
      html[data-theme='light'] { background: #eef2ff; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        grid-auto-flow: row;
        font: 500 13px/1.6 system-ui, -apple-system, 'PingFang SC', sans-serif;
        letter-spacing: 0.14em;
        color: color-mix(in oklab, currentColor 55%, transparent);
        z-index: 9999;
      }
      html[data-theme='dark'] #boot { color: #c7d2fe; }
      html[data-theme='light'] #boot { color: #3730a3; }
      #boot .ring {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        opacity: 0.7;
        animation: boot-spin 0.9s cubic-bezier(0.5, 0.1, 0.3, 1) infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <div class="ring"></div>
      <div>LOADING CARTRIDGE</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
